<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingreso · Control de Paradas TIC</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
</head>
<body class="login-body">
  <div class="bg-atmosphere" aria-hidden="true"></div>

  <main class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-brand">
        <img src="{{ url_for('static', filename='favicon.svg') }}" alt="" width="48" height="48" />
        <p class="brand-kicker">Control de planta · TIC</p>
        <h1 id="loginTitle">Control de Paradas</h1>
        <p class="login-sub">Selecciona un usuario para continuar</p>
      </div>

      <div id="loginAlert" class="ui-alert d-none" role="alert"></div>

      <div id="userGrid" class="user-grid" aria-label="Usuarios disponibles">
        <p class="login-loading">Cargando usuarios…</p>
      </div>

      <div class="login-pin-setup">
        <button type="button" class="btn-ghost login-setup-btn" id="btnAsignarPin">
          Asignar PIN maestro
        </button>
        <p class="login-setup-hint" id="pinSetupHint">
          El PIN se configura una sola vez. Superadmin y admin lo usarán para ingresar.
        </p>
      </div>
    </section>
  </main>

  <!-- Modal PIN ingreso -->
  <div class="modal fade" id="pinModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content glass-modal" id="pinForm">
        <div class="modal-header">
          <div>
            <h2 class="modal-title" id="pinModalTitle">Introduzca su pin para continuar</h2>
            <p class="modal-meta" id="pinModalMeta"></p>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="pinModalAlert" class="ui-alert d-none" role="alert"></div>
          <label class="login-field">
            <span>PIN maestro</span>
            <input
              type="password"
              id="pinInput"
              name="pin"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="8"
              autocomplete="one-time-code"
              placeholder="••••"
              required
            />
          </label>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-solid" id="pinSubmit">Continuar</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal asignar PIN (una sola vez) -->
  <div class="modal fade" id="setupPinModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <form class="modal-content glass-modal" id="setupPinForm">
        <div class="modal-header">
          <div>
            <h2 class="modal-title">Asignar PIN maestro</h2>
            <p class="modal-meta">Esta acción solo puede realizarse una vez</p>
          </div>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <div id="setupPinAlert" class="ui-alert d-none" role="alert"></div>
          <label class="login-field">
            <span>Nuevo PIN (4 a 8 dígitos)</span>
            <input
              type="password"
              id="setupPin"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="8"
              autocomplete="new-password"
              placeholder="••••"
              required
            />
          </label>
          <label class="login-field">
            <span>Confirmar PIN</span>
            <input
              type="password"
              id="setupPinConfirm"
              inputmode="numeric"
              pattern="[0-9]*"
              maxlength="8"
              autocomplete="new-password"
              placeholder="••••"
              required
            />
          </label>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn-ghost" data-bs-dismiss="modal">Cancelar</button>
          <button type="submit" class="btn-solid" id="setupPinSubmit">Guardar PIN</button>
        </div>
      </form>
    </div>
  </div>

  <div id="uiToastHost" class="ui-toast-host" aria-live="polite"></div>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
